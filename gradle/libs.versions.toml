[versions]
junit = "5.11.3"
assertj = "3.26.3"
picocli = "4.7.6"
bouncycastle = "1.86"

[libraries]
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-params = { group = "org.junit.jupiter", name = "junit-jupiter-params" }
junit-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
assertj = { group = "org.assertj", name = "assertj-core", version.ref = "assertj" }
picocli = { group = "info.picocli", name = "picocli", version.ref = "picocli" }
bouncycastle = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
